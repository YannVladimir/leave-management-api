<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Leave Management System</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h2 class="text-center">Welcome to Leave Management System</h2>
                    </div>
                    <div class="card-body">
                        <div th:if="${name != null}">
                            <p>Welcome, <span th:text="${name}"></span>!</p>
                            <p>Your email: <span th:text="${email}"></span></p>
                        </div>
                        <div th:unless="${name != null}">
                            <p>Please <a href="/oauth2/authorization/microsoft">login with Microsoft</a> to continue.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
